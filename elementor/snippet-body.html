<script>/* Restores prototype attributes/elements on Elementor atomic markup (keyed by element id) */
(function(){
  var M=window.CRAIG_ATTRS||{};
  document.querySelectorAll('[data-id]').forEach(function(el){
    var m=M[el.getAttribute('data-id')]; if(!m||el.__craig) return; el.__craig=1;
    if(m.r){var t=document.createElement('template');t.innerHTML=m.r.trim();var n=t.content.firstElementChild;if(n){el.replaceWith(n);}return;}
    var a=m.a||{};
    for(var k in a){ if(k==='style'){el.style.cssText+=';'+a[k];} else el.setAttribute(k,a[k]); }
    if('hidden' in a) el.classList.remove('x-hidden');
  });
  ['sub-page','gl-page','bn-page','rf-page'].forEach(function(c){ if(document.querySelector('main.'+c)) document.documentElement.classList.add(c); });
  // aria-current for navigation
  var p=location.pathname.replace(/\/+$/,'/')||'/';
  document.querySelectorAll('.nav-link[href], .foot-col a[href]').forEach(function(a){
    var h=a.getAttribute('href'); if(h&&h.charAt(0)==='/'&&h.indexOf('#')<0&&h===p) a.setAttribute('aria-current','page');
  });
  // details/summary behaviour for converted FAQ items
  document.querySelectorAll('.tg-details').forEach(function(d){
    var s=d.querySelector(':scope > .tg-summary'); if(!s) return;
    s.setAttribute('role','button'); s.setAttribute('tabindex','0'); s.setAttribute('aria-expanded', d.hasAttribute('open')?'true':'false');
    var tog=function(){ var o=!d.hasAttribute('open'); if(o) d.setAttribute('open',''); else d.removeAttribute('open'); s.setAttribute('aria-expanded',String(o)); d.dispatchEvent(new Event('toggle')); };
    s.addEventListener('click',tog);
    s.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();tog();} });
  });
  // CCM19: footer link opens the consent settings (floating icon is hidden via CSS)
  document.querySelectorAll('.ccm-open').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); if(window.CCM&&typeof CCM.openWidget==='function') CCM.openWidget(); }); });

<script>(() => {
  document.documentElement.classList.add('js');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Navigation: Mobilmenü und Mega-Menü "Leistungen"
  const btn = document.querySelector('[data-menu]');
  const nav = document.getElementById('nav');
  const trigger = document.querySelector('[data-mega-trigger]');
  const mega = document.querySelector('[data-mega]');
  const backdrop = document.querySelector('[data-backdrop]');
  const desktop = window.matchMedia('(min-width: 901px)');
  const fine = window.matchMedia('(hover: hover) and (pointer: fine)');

  const setMenu = (open) => {
    if (!btn) return;
    btn.setAttribute('aria-expanded', String(open));
    btn.querySelector('.sr').textContent = open ? 'Menü schließen' : 'Menü öffnen';
    nav.classList.toggle('is-open', open);
    document.documentElement.classList.toggle('menu-open', open);
    if (!open) setMega(false);
  };
  const setMega = (open) => {
    if (!trigger) return;
    trigger.setAttribute('aria-expanded', String(open));
    mega.classList.toggle('is-open', open);
    if (desktop.matches && backdrop) {
      if (open) { backdrop.hidden = false; requestAnimationFrame(() => backdrop.classList.add('is-on')); }
      else { backdrop.classList.remove('is-on'); setTimeout(() => { if (!mega.classList.contains('is-open')) backdrop.hidden = true; }, 220); }
    }
  };

  btn && btn.addEventListener('click', () => setMenu(btn.getAttribute('aria-expanded') !== 'true'));
  let hoverOpenedAt = 0;
  trigger && trigger.addEventListener('click', () => {
    if (Date.now() - hoverOpenedAt < 600) return;
    setMega(trigger.getAttribute('aria-expanded') !== 'true');
  });
  backdrop && backdrop.addEventListener('click', () => setMega(false));
  nav && nav.addEventListener('click', (e) => { if (e.target.closest('a')) { setMega(false); setMenu(false); } });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (mega && mega.classList.contains('is-open')) { setMega(false); trigger.focus(); }
    else if (nav && nav.classList.contains('is-open')) { setMenu(false); btn.focus(); }
  });
  desktop.addEventListener('change', () => { setMega(false); setMenu(false); });

  // Desktop: Öffnen beim Überfahren mit kurzer Absichtsverzögerung
  if (trigger && mega) {
    const item = trigger.closest('.nav-item');
    let tOpen, tClose;
    item.addEventListener('pointerenter', (e) => {
      if (!desktop.matches || !fine.matches || e.pointerType !== 'mouse') return;
      clearTimeout(tClose); tOpen = setTimeout(() => { hoverOpenedAt = Date.now(); setMega(true); }, 90);
    });
    item.addEventListener('pointerleave', (e) => {
      if (!desktop.matches || e.pointerType !== 'mouse') return;
      clearTimeout(tOpen); tClose = setTimeout(() => setMega(false), 180);
    });
    // Fokus verlässt das Menü: schließen
    item.addEventListener('focusout', (e) => { if (desktop.matches && !item.contains(e.relatedTarget)) setMega(false); });

    // Vorschaubild wechselt mit der Leistung
    const imgs = mega.querySelectorAll('[data-preview-img]');
    const show = (key) => imgs.forEach((im) => im.classList.toggle('is-active', im.dataset.previewImg === key));
    mega.querySelectorAll('[data-preview]').forEach((a) => {
      a.addEventListener('pointerenter', () => show(a.dataset.preview));
      a.addEventListener('focus', () => show(a.dataset.preview));
    });
    mega.addEventListener('pointerleave', () => show('team'));
  }

  // Hero-Hintergrundvideo: passende Datei je Format, erst nach dem Poster laden, pausierbar
  const video = document.querySelector('.hero-video');
  const toggle = document.querySelector('[data-video-toggle]');
  if (video && toggle) {
    const tall = window.matchMedia('(max-aspect-ratio: 4/5)');
    const pick = () => tall.matches ? video.dataset.srcTall
      : (window.innerWidth * (window.devicePixelRatio || 1) > 1100 ? video.dataset.srcXl : video.dataset.srcWide);
    const load = () => {
      const src = pick();
      if (video.getAttribute('src') === src) return;
      video.classList.remove('is-playing');
      video.src = src;
      video.play().catch(() => {});
    };
    const label = () => {
      toggle.textContent = video.paused ? 'Video abspielen' : 'Video anhalten';
      toggle.setAttribute('aria-pressed', String(video.paused));
    };
    video.addEventListener('playing', () => { video.classList.add('is-playing'); label(); });
    video.addEventListener('pause', label);
    toggle.addEventListener('click', () => { video.paused ? video.play() : video.pause(); });
    toggle.hidden = false;
    load();
    tall.addEventListener('change', load);
    // Falls der Browser Autoplay blockiert (z. B. iPhone-Stromsparmodus): bei der ersten Berührung starten
    const kick = () => { if (video.paused && toggle.dataset.user !== 'paused') video.play().catch(() => {}); };
    ['touchstart', 'pointerdown', 'scroll', 'keydown'].forEach((ev) => window.addEventListener(ev, kick, { once: true, passive: true }));
    // außerhalb des Sichtfelds pausieren, spart Akku
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(([en]) => {
        if (!video.src) return;
        if (en.isIntersecting && toggle.dataset.user !== 'paused') video.play().catch(() => {}); else video.pause();
      }, { threshold: 0.1 }).observe(video);
      toggle.addEventListener('click', () => { toggle.dataset.user = video.paused ? 'paused' : ''; });
    }
  }


  // Vorher/Nachher
  document.querySelectorAll('[data-compare]').forEach((fig) => {
    const range = fig.querySelector('.compare-range');
    const apply = () => fig.style.setProperty('--pos', range.value + '%');
    range.addEventListener('input', apply);
    range.addEventListener('pointerdown', () => fig.classList.add('is-dragging'));
    ['pointerup', 'pointercancel', 'blur'].forEach((ev) => range.addEventListener(ev, () => fig.classList.remove('is-dragging')));
    apply();
  });

  // Referenzen: Projekte filtern, bei ungerader Anzahl das erste Projekt breit
  const rfFilter = document.querySelector('[data-rf-filter]');
  const rfGrid = document.querySelector('[data-rf-grid]');
  if (rfFilter && rfGrid) {
    const items = [...rfGrid.querySelectorAll('.rf-item')];
    const show = (cat, animate) => {
      const vis = items.filter((it) => cat === 'alle' || it.dataset.cat === cat);
      items.forEach((it) => { it.hidden = !vis.includes(it); it.classList.remove('is-wide', 'is-in'); });
      if (vis.length % 2 === 1) vis[0].classList.add('is-wide');
      if (animate) { void rfGrid.offsetWidth; vis.forEach((it, i) => { it.style.setProperty('--i', Math.min(i, 8)); it.classList.add('is-in'); }); }
    };
    rfFilter.querySelectorAll('.rf-chip').forEach((chip) => chip.addEventListener('click', () => {
      rfFilter.querySelectorAll('.rf-chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
      show(chip.dataset.cat, true);
    }));
    show('alle', false);
  }

  // Maßkette im Ablauf zeichnet sich beim Erreichen
  const steps = document.querySelector('[data-steps]');
  if (steps) {
    if (!('IntersectionObserver' in window) || reduce.matches) { steps.classList.add('is-in'); }
    else {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((en) => { if (en.isIntersecting) { steps.classList.add('is-in'); io.disconnect(); } });
      }, { threshold: 0.35 });
      io.observe(steps);
    }
  }

  // Kundenstimmen: Video erst beim Klick laden, nur eins gleichzeitig
  document.querySelectorAll('[data-tvid]').forEach((fig) => {
    const btn = fig.querySelector('.tvid-play');
    btn.addEventListener('click', () => {
      const v = document.createElement('video');
      v.src = fig.dataset.src; v.controls = true; v.playsInline = true; v.preload = 'auto';
      v.poster = btn.querySelector('img').src;
      v.setAttribute('aria-label', btn.getAttribute('aria-label').replace(' abspielen', ''));
      v.addEventListener('play', () => document.querySelectorAll('.tvid video').forEach((o) => { if (o !== v) o.pause(); }));
      btn.replaceWith(v);
      v.play().catch(() => {});
      v.focus();
    }, { once: true });
  });
})();

(() => {
  // Header wird fest, sobald der Hero aus dem Bild ist
  const head = document.querySelector('[data-head]');
  const hero = document.querySelector('.hero, .page-hero');
  if (head && hero && 'IntersectionObserver' in window) {
    // Header wird solide, sobald 24px gescrollt sind, damit er nie über Headlines liegt
    const sentinel = document.createElement('div');
    sentinel.setAttribute('aria-hidden', 'true');
    sentinel.style.cssText = 'position:absolute;top:0;left:0;width:1px;height:24px;pointer-events:none;';
    document.body.prepend(sentinel);
    new IntersectionObserver(([en]) => head.classList.toggle('is-solid', !en.isIntersecting)).observe(sentinel);
  } else if (head) { head.classList.add('is-solid'); }

  // Abschnitte blenden beim Erreichen ein
  const items = document.querySelectorAll('.section .h2, .panels, .tvids, .vals, .owners-copy');
  items.forEach((el) => el.setAttribute('data-reveal', ''));
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } }), { threshold: 0.15 });
    items.forEach((el) => io.observe(el));
  } else items.forEach((el) => el.classList.add('is-in'));

  // Formular (Prototyp): Pflichtfelder prüfen, Rückmeldung anzeigen
  const form = document.querySelector('[data-form]');
  if (form) {
    const status = form.querySelector('.form-status');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let first = null;
      form.querySelectorAll('[required]').forEach((f) => {
        const bad = f.type === 'checkbox' ? !f.checked : !f.value.trim() || (f.type === 'email' && !/^\S+@\S+\.\S+$/.test(f.value));
        f.setAttribute('aria-invalid', String(bad));
        if (bad && !first) first = f;
      });
      if (first) {
        status.textContent = 'Bitte füllen Sie die markierten Felder aus.';
        status.classList.add('is-error');
        first.focus();
        return;
      }
      status.classList.remove('is-error');
      status.textContent = 'Danke! Ihre Anfrage ist bei uns eingegangen. Wir melden uns persönlich.';
      form.reset();
    });
  }
})();

(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Leistungs-Slider: blättert ansichtsweise (Desktop drei Karten, mobil eine), keine Automatik
  const rail = document.querySelector('[data-rail]');
  const prev = document.querySelector('[data-rail-prev]');
  const next = document.querySelector('[data-rail-next]');
  const dotsBox = document.querySelector('[data-dots]');
  if (rail) {
    const cards = [...rail.children];
    const metrics = () => {
      const gap = parseFloat(getComputedStyle(rail).columnGap) || 0;
      const w = cards[0].getBoundingClientRect().width + gap;
      const per = Math.max(1, Math.round((rail.clientWidth + gap) / w));
      return { w, per, pages: Math.ceil(cards.length / per) };
    };
    let m = metrics();
    // Überschrift wechselt mit der Gruppe der ersten sichtbaren Karte
    const title = document.querySelector('[data-rail-title]');
    let shown = title ? title.textContent : '';
    let swapT = 0;
    const setTitle = (at) => {
      if (!title) return;
      const first = Math.min(cards.length - 1, at * m.per);
      const next = cards[first].dataset.group;
      if (!next || next === shown) return;
      shown = next;
      if (reduce.matches) { title.textContent = next; return; }
      clearTimeout(swapT);
      title.classList.add('is-swapping');
      swapT = setTimeout(() => { title.textContent = next; title.classList.remove('is-swapping'); }, 200);
    };
    const page = () => Math.min(m.pages - 1, Math.round(rail.scrollLeft / (m.w * m.per)));
    const buildDots = () => {
      if (!dotsBox) return;
      dotsBox.innerHTML = '';
      for (let i = 0; i < m.pages; i++) dotsBox.appendChild(document.createElement('span'));
    };
    const sync = () => {
      const max = rail.scrollWidth - rail.clientWidth - 2;
      if (prev) prev.disabled = rail.scrollLeft <= 2;
      if (next) next.disabled = rail.scrollLeft >= max;
      const at = rail.scrollLeft >= max ? m.pages - 1 : page();
      if (dotsBox) [...dotsBox.children].forEach((d, i) => d.classList.toggle('is-on', i === at));
      setTitle(at);
    };
    const go = (dir) => {
      const target = Math.max(0, Math.min(m.pages - 1, page() + dir));
      rail.scrollTo({ left: target * m.w * m.per, behavior: reduce.matches ? 'auto' : 'smooth' });
    };
    prev && prev.addEventListener('click', () => go(-1));
    next && next.addEventListener('click', () => go(1));
    rail.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    });
    let raf = 0;
    rail.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(sync); }, { passive: true });
    window.addEventListener('resize', () => { m = metrics(); buildDots(); sync(); });
    buildDots(); sync();
  }

  // Vorher/Nachher-Leiste: aktive Karte links, die nächste schaut rechts ins Bild
  const baTrack = document.querySelector('[data-ba-track]');
  if (baTrack) {
    const slides = [...baTrack.children];
    const prevB = document.querySelector('[data-ba-prev]');
    const nextB = document.querySelector('[data-ba-next]');
    const dotBox = document.querySelector('[data-ba-dots]');
    const countEl = document.querySelector('[data-ba-count]');
    const step = () => slides[1] ? slides[1].offsetLeft - slides[0].offsetLeft : baTrack.clientWidth;
    const cur = () => Math.max(0, Math.min(slides.length - 1, Math.round(baTrack.scrollLeft / step())));
    const goTo = (i) => baTrack.scrollTo({ left: Math.max(0, Math.min(slides.length - 1, i)) * step(), behavior: reduce.matches ? 'auto' : 'smooth' });
    slides.forEach((s, i) => {
      if (dotBox) { const d = document.createElement('span'); d.addEventListener('click', () => goTo(i)); dotBox.appendChild(d); }
      s.addEventListener('click', (e) => { if (!s.classList.contains('is-current')) { e.preventDefault(); goTo(i); } });
    });
    const syncBa = () => {
      const max = baTrack.scrollWidth - baTrack.clientWidth - 2;
      const i = baTrack.scrollLeft >= max ? slides.length - 1 : cur();
      if (prevB) prevB.disabled = i <= 0;
      if (nextB) nextB.disabled = i >= slides.length - 1;
      slides.forEach((s, k) => s.classList.toggle('is-current', k === i));
      dotBox && [...dotBox.children].forEach((d, k) => d.classList.toggle('is-on', k === i));
      if (countEl) countEl.textContent = i + 1;
    };
    prevB && prevB.addEventListener('click', () => goTo(cur() - 1));
    nextB && nextB.addEventListener('click', () => goTo(cur() + 1));
    baTrack.addEventListener('keydown', (e) => {
      if (e.target.classList.contains('compare-range')) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(cur() + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur() - 1); }
    });
    let rafB = 0;
    baTrack.addEventListener('scroll', () => { cancelAnimationFrame(rafB); rafB = requestAnimationFrame(syncBa); }, { passive: true });
    window.addEventListener('resize', syncBa);
    syncBa();

    // Ziehen: mit der Maus überall im Bild, per Touch nur am Griff (sonst wird gewischt)
    slides.forEach((slide) => {
      const fig = slide.querySelector('[data-compare]');
      const range = fig.querySelector('.compare-range');
      const set = (x) => {
        const r = fig.getBoundingClientRect();
        range.value = Math.max(0, Math.min(100, ((x - r.left) / r.width) * 100));
        range.dispatchEvent(new Event('input', { bubbles: true }));
      };
      let drag = false;
      const start = (e) => { drag = true; fig.classList.add('is-dragging'); fig.setPointerCapture(e.pointerId); set(e.clientX); e.preventDefault(); };
      fig.addEventListener('pointerdown', (e) => {
        if (!slide.classList.contains('is-current')) return;
        if (e.pointerType === 'mouse' || e.target.closest('[data-handle]')) start(e);
      });
      fig.addEventListener('pointermove', (e) => { if (drag) set(e.clientX); });
      const end = () => { drag = false; fig.classList.remove('is-dragging'); };
      fig.addEventListener('pointerup', end);
      fig.addEventListener('pointercancel', end);
    });
  }

  // Markierte Headlines: Balken wischt hinter den Text, sobald sie im Bild sind
  const marks = document.querySelectorAll('.mark');
  if (!('IntersectionObserver' in window) || reduce.matches) { marks.forEach((m) => m.classList.add('is-marked')); }
  else {
    const io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add('is-marked'); io.unobserve(en.target); }
    }), { threshold: 0.6 });
    marks.forEach((m) => io.observe(m));
  }
})();

</script>
